name: Build EditPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check Android project
        working-directory: android
        run: |
          echo "Android project files:"
          find . -maxdepth 4 -type f | sort | head -300

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10'

      - name: Check Gradle project
        working-directory: android
        run: |
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Gradle Android project found."
          else
            echo "ERROR: settings.gradle/settings.gradle.kts not found in android/"
            exit 1
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: EditPro-debug-APK
          path: 'android/**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
